name: CI
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12"] # 3.11 = tu Mac, 3.12 = Streamlit Cloud
                steps:
                    - uses: actions/checkout@v4
                    - uses: actions/setup-python@v5
                      with:
                        python-version: ${{ matrix.python-version }}
                        cache: pip
                    - run: pip install -r requirements.txt requerements-dev.txt
                    - run: ruff check .
                    - run: pytest -q
                    env:
                        CLAVE_API: clave-de-prueba # Falsa: los tests no llaman a ningún servicio
                        ANTROPHIC_API_KEY: no-se-usa
